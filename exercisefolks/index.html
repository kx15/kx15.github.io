<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ExerciseFolks</title>
  <meta name="description" content="A cosy social fitness game: find times to move with your friends and grow a village together.">
  <meta name="theme-color" content="#FFF6EC">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ExerciseFolks">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFF6EC;
      --card: #FFFFFF;
      --soft: #FFF0E2;
      --ink: #4E4058;
      --ink-2: #7D6F86;
      --line: #F0E1D2;
      --rose: #F4A6B7;
      --rose-d: #E07D93;
      --sage: #A9D3A0;
      --sage-d: #6FAE6A;
      --sky: #BFDDF2;
      --lilac: #CDB8EE;
      --butter: #FFE39A;
      --peach: #FFC6A8;
      --danger: #D8646F;
      --radius: 20px;
      --shadow: 0 2px 0 rgba(120, 80, 60, .05), 0 8px 24px -12px rgba(120, 80, 60, .25);
      --font-d: "Fredoka", "Nunito", system-ui, sans-serif;
      --font-b: "Nunito", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-b);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
    }
    body.modal-open { overflow: hidden; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; border-radius: 10px; }
    #app { max-width: 520px; margin: 0 auto; min-height: 100dvh; }

    /* type */
    .display { font-family: var(--font-d); font-weight: 600; font-size: 40px; line-height: 1.05; letter-spacing: -.01em; }
    .display.sm { font-size: 26px; line-height: 1.15; }
    .h2 { font-family: var(--font-d); font-weight: 600; font-size: 19px; margin: 26px 0 10px; }
    .h2.flat { margin: 0; font-size: 17px; }
    h3 { font-family: var(--font-d); font-weight: 600; font-size: 17px; line-height: 1.25; }
    .lede { color: var(--ink-2); font-size: 17px; }
    .fine { color: var(--ink-2); font-size: 14px; }
    .good { color: var(--sage-d); font-weight: 700; }
    .center { text-align: center; justify-content: center; }
    .note { background: var(--butter); padding: 10px 14px; border-radius: 14px; }

    /* layout bits */
    .row { display: flex; align-items: center; gap: 10px; }
    .row.between { justify-content: space-between; }
    .row.wrap { flex-wrap: wrap; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .grow { flex: 1; min-width: 0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* top + tabs */
    .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
    .logo { display: flex; align-items: center; gap: 8px; font-family: var(--font-d); font-weight: 600; font-size: 19px; }
    .top-right { display: flex; align-items: center; gap: 8px; }
    .who { background: none; border: 0; border-radius: 50%; }
    .clock-chip { border: 0; background: var(--lilac); border-radius: 99px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
    .view { padding: 4px 16px calc(100px + env(safe-area-inset-bottom)); }
    .view-admin { padding-bottom: 40px; }
    .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; z-index: 10; display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0; box-shadow: 0 -8px 24px -16px rgba(120, 80, 60, .3); }
    .tabbar button { position: relative; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 0; font-size: 11.5px; font-weight: 700; color: var(--ink-2); border-radius: 14px; }
    .tabbar button.on { color: var(--rose-d); background: #FFF0F3; }
    .tabbar .dot { position: absolute; top: 2px; right: calc(50% - 20px); background: var(--rose-d); color: #fff; font-style: normal; font-size: 10px; min-width: 17px; height: 17px; line-height: 17px; border-radius: 9px; }

    /* cards */
    .card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
    .card.soft { background: var(--soft); box-shadow: none; }
    .card.empty { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 24px 16px; }
    .card.session.big { border: 2px solid var(--butter); }
    .card.session .when { color: var(--ink-2); font-size: 14px; margin: 2px 0 10px; }
    .card.session > .btn.big { margin-top: 12px; }
    .card.session > .row { margin-top: 10px; }
    .card.session > p.fine, .card.session > p.good { margin-top: 8px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 14px; padding: 11px 18px; font-weight: 800; background: var(--soft); color: var(--ink); transition: transform .12s ease, background .2s; text-decoration: none; }
    .btn:active { transform: scale(.97); }
    .btn.primary { background: var(--rose-d); color: #fff; box-shadow: 0 4px 0 #C66379; }
    .btn.primary:active { box-shadow: 0 1px 0 #C66379; transform: translateY(3px); }
    .btn.ghost { background: transparent; border: 1.5px solid var(--line); }
    .btn.danger { background: #FCE4E6; color: var(--danger); }
    .btn.ghost.danger { background: transparent; }
    .btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 12px; }
    .btn.big { width: 100%; padding: 15px 18px; font-size: 17px; border-radius: 16px; }
    .btn.block { width: 100%; }
    .btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: default; }
    .btn.micro { justify-content: space-between; background: var(--butter); padding: 15px 18px; margin: 4px 0 12px; border-radius: 18px; }
    .btn.micro small { font-weight: 600; color: var(--ink-2); }

    .pill { display: inline-block; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 99px; background: var(--soft); white-space: nowrap; }
    .pill.ok { background: #E1F2DC; color: #4D8B48; }
    .pill.wait { background: #FFF3CC; color: #94741B; }
    .pill.live { background: var(--rose); color: #fff; animation: breathe 2s ease-in-out infinite; }
    .pill.soft { background: var(--soft); color: var(--ink-2); }

    .avatar { display: inline-grid; place-items: center; width: var(--s); height: var(--s); border-radius: 50%; background: var(--c); color: var(--ink); font-family: var(--font-d); font-weight: 600; font-size: calc(var(--s) * .45); flex: none; border: 2px solid #fff; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; background: var(--soft); border-radius: 99px; font-size: 14px; font-weight: 700; }
    .chip small { font-weight: 600; color: var(--ink-2); font-size: 12px; }
    .chip.ok small { color: #4D8B48; }
    .chip.done { background: #E1F2DC; }
    .chip.done small { color: #4D8B48; }
    .chip.no { opacity: .6; }

    .banner { background: var(--butter); border-radius: 16px; padding: 12px 14px; font-weight: 700; margin: 10px 0; }

    /* forms */
    input:not([type=checkbox]):not([type=radio]), select { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; font-size: 16px; }
    input.inline { width: 55%; padding: 8px 10px; }
    label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px; }
    label.row { flex-direction: row; }
    fieldset { border: 0; display: flex; flex-direction: column; gap: 8px; }
    legend { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    .check { flex-direction: row; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
    .check input { width: 20px; height: 20px; accent-color: var(--rose-d); }
    .seg.intensity { display: grid; gap: 8px; }
    .seg-opt { position: relative; }
    .seg-opt input { position: absolute; opacity: 0; }
    .seg-opt span { display: block; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; }
    .seg-opt span small { display: block; font-weight: 600; color: var(--ink-2); font-size: 13px; }
    .seg-opt input:checked + span { border-color: var(--rose-d); background: #FFF0F3; }
    .seg-opt input:focus-visible + span { outline: 3px solid var(--rose); }
    .calc { background: var(--soft); padding: 8px 12px; border-radius: 12px; }

    .seg.tabs { display: flex; gap: 4px; background: #fff; padding: 4px; border-radius: 16px; box-shadow: var(--shadow); margin: 8px 0 16px; }
    .seg.tabs.scroll { overflow-x: auto; }
    .seg.tabs button { flex: 1; border: 0; background: none; padding: 9px 8px; border-radius: 12px; font-weight: 800; color: var(--ink-2); white-space: nowrap; }
    .seg.tabs button.on { background: var(--rose-d); color: #fff; }

    /* home */
    .greet { margin: 6px 0 6px; }
    .goal { margin-bottom: 0; }
    .goal-dots { display: flex; gap: 8px; margin: 10px 0 6px; }
    .goal-dots span { width: 26px; height: 26px; border-radius: 50%; background: var(--soft); border: 2px dashed #E8D2BD; }
    .goal-dots span.on { background: var(--sage); border: 2px solid var(--sage-d); }
    .big-num { font-family: var(--font-d); font-size: 34px; font-weight: 600; line-height: 1.1; margin: 4px 0 2px; }
    .big-num small { font-size: 15px; color: var(--ink-2); }
    .big-num.sm { font-size: 24px; margin: 0; }
    .grid2 + .btn.micro { margin-top: 12px; }
    .village-peek { cursor: pointer; }
    .village-peek svg { width: 100%; height: auto; display: block; margin: 6px 0; max-height: 220px; }
    .feed { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .feed li { display: flex; gap: 12px; align-items: flex-start; background: #fff; border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); }
    .feed .ficon { font-size: 20px; line-height: 1.2; }
    .feed small { color: var(--ink-2); font-size: 12.5px; }

    /* availability */
    .week-nav { margin-bottom: 4px; }
    .avail { display: grid; grid-template-columns: 34px repeat(7, 1fr); gap: 3px; margin: 12px 0 14px; user-select: none; }
    .dh { text-align: center; font-size: 12px; font-weight: 800; color: var(--ink-2); line-height: 1.1; padding-bottom: 4px; }
    .dh small { display: block; font-weight: 600; }
    .hl { font-size: 11px; color: var(--ink-2); text-align: right; padding-right: 4px; line-height: 28px; }
    .cell { height: 28px; border: 0; border-radius: 7px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); position: relative; padding: 0; }
    .cell i { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-size: 13px; line-height: 1; color: #B79BE0; letter-spacing: -1px; }
    .cell.on { background: var(--sage); box-shadow: none; }
    .cell.on i { color: #fff; }
    .cell.match { background: var(--sage-d); }
    .cell.past { opacity: .35; }
    .gcal { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

    .slot .chips { margin: 8px 0 10px; }
    .suggest { font-size: 15px; }

    /* village */
    .balance { text-align: center; background: var(--butter); border-radius: 16px; padding: 6px 14px; line-height: 1.1; }
    .balance b { font-family: var(--font-d); font-size: 22px; display: block; }
    .balance small { font-size: 11px; font-weight: 700; color: var(--ink-2); }
    .levelbar { height: 10px; background: #fff; border-radius: 99px; margin: 12px 0 6px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
    .levelbar span { display: block; height: 100%; background: linear-gradient(90deg, var(--sage), var(--butter)); border-radius: 99px; transition: width .6s ease; }
    .village-wrap { margin: 10px -16px 6px; background: radial-gradient(ellipse at 50% 30%, #FFFBF3, var(--bg) 70%); }
    .village-wrap svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
    svg.village.interactive .tile { cursor: pointer; transition: fill .15s; }
    svg.village.interactive .tile:hover { fill: #EAF6DE; }
    .is-placing .tile { animation: tilehint 1.6s ease-in-out infinite; }
    svg.village .item { cursor: pointer; }
    svg.village .item.selected { filter: drop-shadow(0 0 6px #fff); }
    .sel-ring { animation: spin 8s linear infinite; transform-box: fill-box; transform-origin: center; }
    .toolbar { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow); font-size: 14px; }
    .toolbar span { flex: 1; }
    .shop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .shop-item { border: 0; background: #fff; border-radius: 18px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: var(--shadow); font-weight: 800; font-size: 13.5px; text-align: center; }
    .shop-item small { color: var(--rose-d); font-weight: 800; font-size: 12.5px; }
    .shop-item[aria-disabled="true"] { opacity: .55; }
    .shop-item.locked small { color: var(--ink-2); }
    .shop-item.locked svg { filter: grayscale(1); opacity: .6; }

    /* art animation */
    .sway { animation: sway 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    .glow-window { animation: pulse 4s ease-in-out infinite; }
    .shimmer { animation: shimmer 3.5s ease-in-out infinite; }
    .shimmer.delay, .steam .delay { animation-delay: 1.4s; }
    .steam path { animation: steam 3s ease-in-out infinite; }
    .spray { animation: spray 1.6s ease-in-out infinite; }
    .tail { animation: wag 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 100%; }
    .swinging { animation: swing 3s ease-in-out infinite; transform-box: view-box; transform-origin: 0 -32px; }

    @keyframes sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes shimmer { 0%, 100% { opacity: .3; transform: translateX(0); } 50% { opacity: 1; transform: translateX(2px); } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes spray { 0%, 100% { transform: translateY(0); opacity: .6; } 50% { transform: translateY(-3px); opacity: 1; } }
    @keyframes wag { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
    @keyframes swing { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
    @keyframes tilehint { 0%, 100% { fill-opacity: 1; } 50% { fill-opacity: .7; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* rewards */
    .voucher { display: flex; align-items: center; gap: 12px; }
    .vicon { font-size: 28px; width: 52px; height: 52px; display: grid; place-items: center; background: var(--soft); border-radius: 16px; flex: none; }
    .vprice { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; line-height: 1; }
    .vprice b { font-family: var(--font-d); font-size: 20px; }
    .vprice small { font-size: 11px; color: var(--ink-2); font-weight: 700; }
    .list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .list li { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); }
    .list li span { flex: 1; font-weight: 700; }
    .list li small { color: var(--ink-2); font-size: 13px; }

    /* me */
    .profile { display: flex; align-items: center; gap: 14px; margin: 8px 0 16px; }
    .weeks { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; height: 64px; margin: 12px 0 8px; }
    .wk { background: var(--soft); border-radius: 8px; display: flex; align-items: flex-end; overflow: hidden; }
    .wk span { display: block; width: 100%; background: var(--peach); border-radius: 8px 8px 0 0; }
    .wk.met span { background: var(--sage); }
    .wk.crunch { background: repeating-linear-gradient(45deg, var(--soft) 0 5px, #EADBF8 5px 10px); }
    .wk.now { box-shadow: inset 0 0 0 2px var(--rose); }
    .code { font-family: ui-monospace, monospace; letter-spacing: .08em; background: var(--soft); padding: 1px 6px; border-radius: 6px; }
    .switch { position: relative; display: inline-block; width: 50px; height: 30px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .switch span { position: absolute; inset: 0; background: #E9DCCF; border-radius: 99px; transition: background .2s; cursor: pointer; }
    .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; background: #fff; border-radius: 50%; transition: transform .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
    .switch input:checked + span { background: var(--sage-d); }
    .switch input:checked + span::after { transform: translateX(20px); }
    .switch input:disabled + span { opacity: .45; }
    .switch input:focus-visible + span { outline: 3px solid var(--rose); }

    /* admin */
    .clock h3 { margin-bottom: 2px; }
    .clock .row.wrap { margin-top: 10px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .stats div { background: #fff; border-radius: 16px; padding: 10px; text-align: center; box-shadow: var(--shadow); }
    .stats b { font-family: var(--font-d); font-size: 24px; display: block; }
    .stats small { color: var(--ink-2); font-size: 12px; font-weight: 700; }
    .tablewrap { overflow-x: auto; background: #fff; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 8px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
    td .btn { white-space: nowrap; }
    .pos { color: var(--sage-d); } .neg { color: var(--danger); }
    .voucher-edit { display: flex; flex-direction: column; gap: 8px; }
    .voucher-edit .row input[type=number] { width: 100px; }

    /* onboarding */
    .onboard { padding: calc(28px + env(safe-area-inset-top)) 20px 40px; display: flex; flex-direction: column; gap: 16px; max-width: 520px; margin: 0 auto; }
    .hero-village svg { width: 100%; max-width: 360px; display: block; margin: 0 auto; }
    .ticks { list-style: none; display: flex; flex-direction: column; gap: 8px; margin: 8px 0 14px; }
    .ticks li { padding-left: 28px; position: relative; font-size: 15px; }
    .ticks li::before { content: "✓"; position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--sage); color: #fff; font-size: 12px; display: grid; place-items: center; font-weight: 800; }
    .ticks.no li::before { content: "✕"; background: var(--rose); }

    /* modal sheet */
    #modal .scrim { position: fixed; inset: 0; background: rgba(78, 64, 88, .35); z-index: 40; animation: fade .2s ease; }
    #modal .sheet { position: fixed; z-index: 41; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 520px; max-height: 92dvh; overflow-y: auto; background: var(--bg); border-radius: 26px 26px 0 0; padding: 22px 18px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; animation: up .28s cubic-bezier(.2, .9, .3, 1.1); }
    #modal .sheet::before { content: ""; width: 44px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin: -8px 0 4px; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; }
    .list.pick button { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: none; text-align: left; font-weight: 700; }
    .list.pick button span { flex: 1; display: flex; flex-direction: column; }
    .list.pick small { font-weight: 600; }
    .sheet.celebrate { overflow: hidden; text-align: center; padding-top: 30px; }
    .celebrate-body { display: flex; flex-direction: column; gap: 10px; align-items: center; position: relative; }
    .cele-icon { font-size: 56px; line-height: 1; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
    .cele-pts { font-family: var(--font-d); font-weight: 600; font-size: 56px; color: var(--rose-d); line-height: 1; animation: pop .6s .1s both cubic-bezier(.2, 1.6, .4, 1); }
    .cele-pts small { font-size: 22px; }
    .confetti i { position: absolute; top: -10px; left: var(--x); width: 10px; height: 14px; background: var(--c); border-radius: 50% 0 50% 0; animation: fall 2.6s calc(var(--i) * .08s) ease-in forwards; opacity: 0; }
    @keyframes fall { 0% { opacity: 1; transform: translateY(0) rotate(0); } 100% { opacity: 0; transform: translateY(380px) rotate(540deg); } }
    @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes up { from { transform: translate(-50%, 40px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    @keyframes fade { from { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
