<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ExerciseFolks</title>
  <meta name="description" content="A cosy social fitness game: find times to move with your friends and grow a village together.">
  <meta name="theme-color" content="#7F6A8B">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ExerciseFolks">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #EEE6DC;
      --card: #FBF7F1;
      --soft: #F3EBE1;
      --ink: #3B3340;
      --ink-2: #786E7D;
      --line: #E6DBCF;
      --plum: #7F6A8B;
      --plum-d: #6A5676;
      --lavender: #CFC0DC;
      --lav-soft: #E6DDEE;
      --sage: #A9C0A1;
      --sage-d: #6F8F72;
      --rose: #E9CCC4;
      --rose-soft: #F3E5DF;
      --teal: #5D8A86;
      --teal-d: #48706C;
      --gold: #E8B54A;
      --danger: #C4626B;
      --radius: 22px;
      --shadow: 0 1px 0 rgba(80, 60, 70, .04), 0 12px 26px -16px rgba(80, 60, 70, .38);
      --font-d: "Poppins", "Nunito", system-ui, sans-serif;
      --font-b: "Nunito", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; background: var(--bg); }
    body { background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100dvh; }
    body.modal-open { overflow: hidden; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 10px; }
    #app { max-width: 520px; margin: 0 auto; min-height: 100dvh; }

    /* type */
    .display { font-family: var(--font-d); font-weight: 700; font-size: 38px; line-height: 1.08; letter-spacing: -.02em; }
    .display.sm { font-size: 24px; line-height: 1.2; letter-spacing: -.01em; }
    .h2 { font-family: var(--font-d); font-weight: 700; font-size: 18px; margin: 24px 0 10px; }
    .h2.flat { margin: 0; font-size: 16px; }
    h3 { font-family: var(--font-d); font-weight: 600; font-size: 16.5px; line-height: 1.3; }
    .lede { color: var(--ink-2); font-size: 17px; }
    .fine { color: var(--ink-2); font-size: 14px; }
    .good { color: var(--sage-d); font-weight: 800; }
    .center { text-align: center; justify-content: center; }
    .note { background: var(--lav-soft); padding: 10px 14px; border-radius: 14px; }

    .row { display: flex; align-items: center; gap: 10px; }
    .row.between { justify-content: space-between; }
    .row.wrap { flex-wrap: wrap; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .grow { flex: 1; min-width: 0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* plum header with a rounded bottom; the first card overlaps it */
    .topbar { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px; padding: calc(12px + env(safe-area-inset-top)) 14px 54px; background: var(--plum); color: #fff; border-radius: 0 0 30px 30px; }
    .tb-title { font-family: var(--font-d); font-weight: 600; font-size: 21px; text-align: center; }
    .tb-btn { position: relative; background: none; border: 0; color: #fff; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; }
    .tb-btn.bell i { position: absolute; top: 7px; right: 9px; width: 9px; height: 9px; border-radius: 50%; background: #F07A70; box-shadow: 0 0 0 2px var(--plum); }
    .top-right { display: flex; align-items: center; gap: 4px; }
    .who { background: none; border: 0; border-radius: 50%; }
    .view { position: relative; margin-top: -40px; padding: 0 16px calc(100px + env(safe-area-inset-bottom)); }
    .view-home { padding-bottom: calc(170px + env(safe-area-inset-bottom)); }
    .view-admin { padding-bottom: 40px; }
    .clock-chip { display: block; margin: 0 auto 10px; border: 0; background: var(--lav-soft); color: var(--plum-d); border-radius: 99px; padding: 5px 12px; font-size: 12.5px; font-weight: 800; box-shadow: var(--shadow); }

    .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; z-index: 10; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--card); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); border-radius: 24px 24px 0 0; box-shadow: 0 -10px 26px -18px rgba(80, 60, 70, .4); }
    .tabbar button { position: relative; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 0; font-size: 11.5px; font-weight: 800; color: var(--ink-2); border-radius: 14px; }
    .tabbar button.on { color: var(--plum-d); background: var(--lav-soft); }
    .tabbar .dot { position: absolute; top: 2px; right: calc(50% - 20px); background: #F07A70; color: #fff; font-style: normal; font-size: 10px; min-width: 17px; height: 17px; line-height: 17px; border-radius: 9px; }
    .cta-dock { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); bottom: calc(74px + env(safe-area-inset-bottom)); width: 100%; max-width: 520px; padding: 0 22px; pointer-events: none; }
    .cta-dock .btn { pointer-events: auto; border-radius: 99px; box-shadow: 0 5px 0 var(--teal-d), 0 14px 26px -10px rgba(40, 70, 70, .5); }

    /* cards */
    .card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; border: 1px solid #F1E9DF; }
    .card.soft { background: var(--soft); box-shadow: none; }
    .card.empty { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 24px 16px; }
    .card.invite { border: 2px solid var(--lavender); }
    .card-head { width: 100%; display: flex; align-items: center; justify-content: space-between; background: none; border: 0; padding: 0 0 10px; margin-bottom: 12px; border-bottom: 1px solid var(--line); color: var(--ink); text-align: left; }
    .card-head svg { color: var(--ink-2); flex: none; }
    .card.session .when { color: var(--ink-2); font-size: 14px; margin: 2px 0 10px; }
    .card > .btn.big, .card > .row { margin-top: 12px; }
    .card > p.fine, .card > p.good { margin-top: 8px; }

    .stat3 { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
    .stat3 div + div { border-left: 1px solid var(--line); }
    .stat3 b { display: block; font-family: var(--font-d); font-weight: 700; font-size: 30px; line-height: 1.1; }
    .stat3 small { color: var(--ink-2); font-size: 13px; font-weight: 700; }
    .goal-line { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
    .goal-line .fine { font-size: 13px; }
    .goal-dots { display: flex; gap: 6px; flex: none; }
    .goal-dots span { width: 18px; height: 18px; border-radius: 50%; background: var(--soft); border: 2px dashed #D9CBBD; }
    .goal-dots span.on { background: var(--sage); border: 2px solid var(--sage-d); }

    .feature { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; margin-bottom: 12px; }
    .faces { display: flex; justify-content: center; margin-bottom: 6px; }
    .face { border-radius: 50%; padding: 3px; background: var(--line); }
    .face + .face { margin-left: -12px; }
    .face.going { background: var(--lavender); }
    .face.in { background: var(--gold); }
    .face .avatar { border-width: 3px; }
    .feature-title { font-family: var(--font-d); font-weight: 600; font-size: 18px; line-height: 1.25; }
    .feature-when { color: var(--ink-2); font-size: 14.5px; font-weight: 600; margin-bottom: 4px; }
    .spot { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
    .spot + .spot { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 6px; }
    .spot-icon { width: 46px; height: 46px; border-radius: 50%; background: var(--rose-soft); display: grid; place-items: center; font-size: 22px; flex: none; border: 1px solid var(--line); }
    .spot-title { font-weight: 800; font-size: 15px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 14px; padding: 11px 18px; font-weight: 800; background: var(--soft); color: var(--ink); transition: transform .12s ease, background .2s; text-decoration: none; border: 1px solid var(--line); }
    .btn:active { transform: scale(.97); }
    .btn.primary, .btn.teal { background: var(--teal); color: #fff; border-color: var(--teal); box-shadow: 0 4px 0 var(--teal-d); }
    .btn.primary:active, .btn.teal:active { box-shadow: 0 1px 0 var(--teal-d); transform: translateY(3px); }
    .btn.ghost { background: transparent; }
    .btn.danger { background: #F7E1E2; color: var(--danger); border-color: #F0CFD1; }
    .btn.ghost.danger { background: transparent; }
    .btn.sm { padding: 7px 13px; font-size: 14px; border-radius: 12px; }
    .btn.big { width: 100%; padding: 15px 18px; font-size: 17px; border-radius: 16px; }
    .btn.block { width: 100%; }
    .btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: default; }
    .btn.micro { justify-content: space-between; background: var(--rose); border-color: #E2BDB3; padding: 15px 18px; margin: 0 0 14px; border-radius: 20px; text-align: left; }
    .btn.micro small { font-weight: 700; color: var(--ink-2); white-space: nowrap; }

    .pill { display: inline-block; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 99px; background: var(--soft); white-space: nowrap; }
    .pill.ok { background: #DDE9D8; color: #4F7A52; }
    .pill.wait { background: #F7EBCB; color: #8D6E1E; }
    .pill.live { background: var(--plum); color: #fff; animation: breathe 2s ease-in-out infinite; }
    .pill.soft { background: var(--lav-soft); color: var(--plum-d); }

    .avatar { display: inline-grid; place-items: center; width: var(--s); height: var(--s); border-radius: 50%; background: var(--c); color: var(--ink); font-family: var(--font-d); font-weight: 600; font-size: calc(var(--s) * .42); flex: none; border: 2px solid #fff; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .card.session .chips, .slot .chips { justify-content: flex-start; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; background: var(--soft); border-radius: 99px; font-size: 14px; font-weight: 700; border: 1px solid var(--line); }
    .chip small { font-weight: 700; color: var(--ink-2); font-size: 12px; }
    .chip.ok small, .chip.done small { color: #4F7A52; }
    .chip.done { background: #E3EDDF; }
    .chip.no { opacity: .6; }

    .banner { background: var(--lav-soft); color: var(--plum-d); border-radius: 18px; padding: 12px 14px; font-weight: 800; margin: 0 0 14px; }

    /* forms */
    input:not([type=checkbox]):not([type=radio]), select { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; font-size: 16px; }
    input.inline { width: 55%; padding: 8px 10px; }
    label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px; }
    label.row { flex-direction: row; }
    fieldset { border: 0; display: flex; flex-direction: column; gap: 8px; }
    legend { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    .check { flex-direction: row; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
    .check input { width: 20px; height: 20px; accent-color: var(--teal); }
    .seg.intensity { display: grid; gap: 8px; }
    .seg-opt { position: relative; }
    .seg-opt input { position: absolute; opacity: 0; }
    .seg-opt span { display: block; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; }
    .seg-opt span small { display: block; font-weight: 600; color: var(--ink-2); font-size: 13px; }
    .seg-opt input:checked + span { border-color: var(--plum); background: var(--lav-soft); }
    .seg-opt input:focus-visible + span { outline: 3px solid var(--gold); }
    .calc { background: var(--soft); padding: 8px 12px; border-radius: 12px; }

    .seg.tabs { display: flex; gap: 4px; background: var(--card); padding: 5px; border-radius: 18px; box-shadow: var(--shadow); margin: 0 0 16px; border: 1px solid #F1E9DF; }
    .seg.tabs.scroll { overflow-x: auto; }
    .seg.tabs button { flex: 1; border: 0; background: none; padding: 9px 8px; border-radius: 13px; font-weight: 800; color: var(--ink-2); white-space: nowrap; }
    .seg.tabs button.on { background: var(--plum); color: #fff; }

    .village-peek { cursor: pointer; }
    .peek-art { border-radius: 16px; overflow: hidden; margin-bottom: 8px; }
    .peek-art svg { width: 100%; height: auto; display: block; }
    .feed-title { margin-bottom: 10px; }
    .feed { list-style: none; display: flex; flex-direction: column; }
    .feed li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; }
    .feed li + li { border-top: 1px solid var(--line); }
    .feed li p { font-weight: 700; font-size: 14.5px; line-height: 1.35; }
    .feed .ficon { font-size: 22px; line-height: 1.1; min-width: 34px; text-align: center; }
    .feed small { color: var(--ink-2); font-size: 12.5px; }
    .stack-faces { display: inline-flex; }
    .stack-faces .avatar + .avatar { margin-left: -12px; }
    .feed.compact li { padding: 8px 0; }

    /* availability */
    .week-nav { margin-bottom: 4px; }
    .avail { display: grid; grid-template-columns: 34px repeat(7, 1fr); gap: 3px; margin: 12px 0 14px; user-select: none; background: var(--card); padding: 10px 8px; border-radius: 20px; box-shadow: var(--shadow); }
    .dh { text-align: center; font-size: 12px; font-weight: 800; color: var(--ink-2); line-height: 1.1; padding-bottom: 4px; }
    .dh small { display: block; font-weight: 600; }
    .hl { font-size: 11px; color: var(--ink-2); text-align: right; padding-right: 4px; line-height: 28px; }
    .cell { height: 28px; border: 0; border-radius: 8px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); position: relative; padding: 0; }
    .cell i { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-size: 13px; line-height: 1; color: var(--plum); letter-spacing: -1px; }
    .cell.on { background: var(--sage); box-shadow: none; }
    .cell.on i { color: #fff; }
    .cell.match { background: var(--sage-d); }
    .cell.past { opacity: .35; }
    .gcal { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .slot .chips { margin: 8px 0 10px; }
    .suggest { font-size: 15px; }

    /* adventure (village) */
    .adventure { position: relative; background: #7E9FA6; border-radius: 30px; overflow: hidden; border: 6px solid var(--card); box-shadow: var(--shadow); }
    .adv-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 0; }
    .round-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--card); border: 0; display: grid; place-items: center; color: var(--ink); box-shadow: 0 4px 10px -4px rgba(0, 0, 0, .3); font-family: var(--font-d); font-weight: 700; font-size: 13px; line-height: 1; text-align: center; }
    .round-btn.pts { width: auto; min-width: 44px; padding: 0 10px; border-radius: 22px; display: flex; flex-direction: column; justify-content: center; }
    .round-btn small { font-size: 9px; color: var(--ink-2); }
    .ring { filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .2)); }
    .stage-name { position: relative; z-index: 2; text-align: center; font-family: var(--font-d); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 6px rgba(40, 60, 70, .5); line-height: 1.25; margin-top: 4px; }
    .adv-map { margin-top: -14px; }
    .adv-map svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
    .adv-sheet { position: relative; background: var(--card); border-radius: 24px 24px 0 0; margin-top: -26px; padding: 8px 16px 12px; min-height: 90px; }
    .adv-sheet .handle { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 8px; }
    .adv-sheet .toolbar { box-shadow: none; padding: 4px 0; background: none; }
    .stage-hint { margin: 10px 0 0; }
    svg.village.interactive .tile { cursor: pointer; transition: fill .15s; }
    svg.village.interactive .tile:hover { fill: #D6E8C0; }
    .is-placing .tile { animation: tilehint 1.6s ease-in-out infinite; }
    svg.village .item { cursor: pointer; }
    svg.village .item.selected { filter: drop-shadow(0 0 6px #fff); }
    .sel-ring { animation: spin 8s linear infinite; transform-box: fill-box; transform-origin: center; }
    .toolbar { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow); font-size: 14px; }
    .toolbar span { flex: 1; }
    .shop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .shop-item { border: 1px solid #F1E9DF; background: var(--card); border-radius: 18px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: var(--shadow); font-weight: 800; font-size: 13.5px; text-align: center; }
    .shop-item small { color: var(--teal-d); font-weight: 800; font-size: 12.5px; }
    .shop-item[aria-disabled="true"] { opacity: .55; }
    .shop-item.locked small { color: var(--ink-2); }
    .shop-item.locked svg { filter: grayscale(1); opacity: .6; }

    /* art animation */
    .sway { animation: sway 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    .glow-window { animation: pulse 4s ease-in-out infinite; }
    .shimmer { animation: shimmer 3.5s ease-in-out infinite; }
    .shimmer.delay, .steam .delay { animation-delay: 1.4s; }
    .steam path { animation: steam 3s ease-in-out infinite; }
    .spray { animation: spray 1.6s ease-in-out infinite; }
    .tail { animation: wag 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 100%; }
    .swinging { animation: swing 3s ease-in-out infinite; transform-box: view-box; transform-origin: 0 -32px; }
    .cloud.drift { animation: drift 14s ease-in-out infinite; }
    .cloud.slow { animation-duration: 20s; animation-direction: reverse; }
    .waves path { animation: pulse 4s ease-in-out infinite; }
    .waves path:nth-child(2) { animation-delay: 1.3s; }
    @keyframes sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes shimmer { 0%, 100% { opacity: .3; transform: translateX(0); } 50% { opacity: 1; transform: translateX(2px); } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-8px); } }
    @keyframes spray { 0%, 100% { transform: translateY(0); opacity: .6; } 50% { transform: translateY(-3px); opacity: 1; } }
    @keyframes wag { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
    @keyframes swing { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    @keyframes drift { 0%, 100% { translate: 0 0; } 50% { translate: 14px 0; } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .75; } }
    @keyframes tilehint { 0%, 100% { fill-opacity: 1; } 50% { fill-opacity: .7; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* collections & rewards */
    .profile-card { display: flex; align-items: center; gap: 14px; }
    .profile-card .avatar { box-shadow: 0 0 0 3px var(--lavender); }
    .pname { font-family: var(--font-d); font-weight: 700; font-size: 20px; line-height: 1.2; }
    .pts-badge { text-align: center; background: var(--lav-soft); color: var(--plum-d); border-radius: 16px; padding: 6px 12px; line-height: 1.05; }
    .pts-badge b { display: block; font-family: var(--font-d); font-size: 20px; }
    .pts-badge small { font-size: 11px; font-weight: 800; }
    .divider { display: flex; align-items: center; gap: 10px; font-family: var(--font-d); font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); margin: 4px 0 14px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .collect { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .obj { position: relative; border: 0; background: var(--rose-soft); border-radius: 18px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 0; font-weight: 800; font-size: 13px; line-height: 1.2; text-align: center; }
    .obj small { color: var(--ink-2); font-weight: 700; font-size: 11.5px; }
    .obj.empty { background: var(--soft); }
    .obj.empty svg { opacity: .45; filter: grayscale(.6); }
    .obj-count { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--plum); color: #fff; font-style: normal; font-size: 12px; display: grid; place-items: center; }
    .tracker { display: flex; align-items: center; gap: 12px; }
    .track { height: 14px; border-radius: 99px; background: var(--soft); margin: 8px 0 4px; overflow: hidden; border: 1px solid var(--line); }
    .track span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #F2CF7B, var(--gold)); }
    .gift { font-size: 38px; }
    .tiers { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .tier { display: flex; align-items: center; gap: 12px; border: 0; background: var(--lav-soft); border-radius: 18px; padding: 12px 14px; text-align: left; color: var(--ink); }
    .tier b { display: block; font-family: var(--font-d); font-weight: 600; font-size: 15px; }
    .tier small { display: block; color: var(--ink-2); font-size: 12.5px; font-weight: 700; }
    .tier.done { background: #E7EEDF; }
    .tier-icon { font-size: 22px; }
    .tier svg { color: var(--ink-2); flex: none; }
    .voucher { display: flex; align-items: center; gap: 12px; }
    .vicon { font-size: 26px; width: 52px; height: 52px; display: grid; place-items: center; background: var(--rose-soft); border-radius: 16px; flex: none; }
    .vprice { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; line-height: 1; }
    .vprice b { font-family: var(--font-d); font-size: 19px; }
    .vprice small { font-size: 11px; color: var(--ink-2); font-weight: 700; }
    .list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .list li { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); }
    .list li span { flex: 1; font-weight: 700; }
    .list li small { color: var(--ink-2); font-size: 13px; }

    /* me */
    .big-num { font-family: var(--font-d); font-size: 30px; font-weight: 700; line-height: 1.1; }
    .big-num small { font-size: 14px; color: var(--ink-2); }
    .big-num.sm { font-size: 22px; }
    .weeks { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; height: 64px; margin: 12px 0 8px; }
    .wk { background: var(--soft); border-radius: 8px; display: flex; align-items: flex-end; overflow: hidden; }
    .wk span { display: block; width: 100%; background: var(--rose); border-radius: 8px 8px 0 0; }
    .wk.met span { background: var(--sage); }
    .wk.crunch { background: repeating-linear-gradient(45deg, var(--soft) 0 5px, var(--lav-soft) 5px 10px); }
    .wk.now { box-shadow: inset 0 0 0 2px var(--plum); }
    .code { font-family: ui-monospace, monospace; letter-spacing: .08em; background: var(--soft); padding: 1px 6px; border-radius: 6px; }
    .switch { position: relative; display: inline-block; width: 50px; height: 30px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
    .switch span { position: absolute; inset: 0; background: #DDD1C5; border-radius: 99px; transition: background .2s; cursor: pointer; }
    .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; background: #fff; border-radius: 50%; transition: transform .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .15); }
    .switch input:checked + span { background: var(--teal); }
    .switch input:checked + span::after { transform: translateX(20px); }
    .switch input:disabled + span { opacity: .45; }
    .switch input:focus-visible + span { outline: 3px solid var(--gold); }

    /* admin */
    .admin-top { margin-bottom: 10px; }
    .clock h3 { margin-bottom: 2px; }
    .clock .row.wrap { margin-top: 10px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .stats div { background: var(--card); border-radius: 16px; padding: 10px; text-align: center; box-shadow: var(--shadow); }
    .stats b { font-family: var(--font-d); font-size: 22px; display: block; }
    .stats small { color: var(--ink-2); font-size: 12px; font-weight: 700; }
    .tablewrap { overflow-x: auto; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 8px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
    td .btn { white-space: nowrap; }
    .pos { color: var(--sage-d); } .neg { color: var(--danger); }
    .voucher-edit { display: flex; flex-direction: column; gap: 8px; }
    .voucher-edit .row input[type=number] { width: 100px; }

    /* onboarding */
    .onboard { padding: calc(28px + env(safe-area-inset-top)) 20px 40px; display: flex; flex-direction: column; gap: 16px; max-width: 520px; margin: 0 auto; }
    .hero-village { border-radius: 28px; overflow: hidden; border: 6px solid var(--card); box-shadow: var(--shadow); }
    .hero-village svg { width: 100%; display: block; }
    .ticks { list-style: none; display: flex; flex-direction: column; gap: 8px; margin: 8px 0 14px; }
    .ticks li { padding-left: 28px; position: relative; font-size: 15px; }
    .ticks li::before { content: "✓"; position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--sage-d); color: #fff; font-size: 12px; display: grid; place-items: center; font-weight: 800; }
    .ticks.no li::before { content: "✕"; background: var(--rose-d, #C98F86); }

    /* modal sheet */
    #modal .scrim { position: fixed; inset: 0; background: rgba(59, 51, 64, .4); z-index: 40; animation: fade .2s ease; }
    #modal .sheet { position: fixed; z-index: 41; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 520px; max-height: 92dvh; overflow-y: auto; background: var(--card); border-radius: 28px 28px 0 0; padding: 22px 18px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; animation: up .28s cubic-bezier(.2, .9, .3, 1.1); }
    #modal .sheet::before { content: ""; width: 44px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin: -8px 0 4px; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; }
    .list.pick li { box-shadow: none; border: 1px solid var(--line); }
    .list.pick button { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: none; text-align: left; font-weight: 700; }
    .list.pick button span { flex: 1; display: flex; flex-direction: column; }
    .list.pick small { font-weight: 600; }
    .sheet.celebrate { overflow: hidden; text-align: center; padding-top: 30px; }
    .celebrate-body { display: flex; flex-direction: column; gap: 10px; align-items: center; position: relative; }
    .cele-icon { font-size: 56px; line-height: 1; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
    .cele-pts { font-family: var(--font-d); font-weight: 700; font-size: 54px; color: var(--plum); line-height: 1; animation: pop .6s .1s both cubic-bezier(.2, 1.6, .4, 1); }
    .cele-pts small { font-size: 22px; }
    .confetti i { position: absolute; top: -10px; left: var(--x); width: 10px; height: 14px; background: var(--c); border-radius: 50% 0 50% 0; animation: fall 2.6s calc(var(--i) * .08s) ease-in forwards; opacity: 0; }
    @keyframes fall { 0% { opacity: 1; transform: translateY(0) rotate(0); } 100% { opacity: 0; transform: translateY(380px) rotate(540deg); } }
    @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes up { from { transform: translate(-50%, 40px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    @keyframes fade { from { opacity: 0; } }

    .toast { position: fixed; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 14px; font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    @media (max-width: 360px) {
      .shop, .collect { grid-template-columns: repeat(2, 1fr); }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .display { font-size: 32px; }
    }
  </style>
</head>
